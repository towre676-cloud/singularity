name: Exact research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  formal-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean 4.12.0 release (core library only)
        run: |
          curl -sSL -o lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.12.0/lean-4.12.0-linux.tar.zst
          tar --zstd -xf lean.tar.zst
          echo "$PWD/lean-4.12.0-linux/bin" >> "$GITHUB_PATH"
      - name: Kernel build and source-bound axiom audit (P07, P08, P33, OE12)
        run: |
          python3 formal/tools/gen_certificates.py --check
          python3 scripts/check_formal.py
  formal-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean 4.12.0 release
        run: |
          curl -fsSL -o lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.12.0/lean-4.12.0-linux.tar.zst
          tar --zstd -xf lean.tar.zst
          echo "$PWD/lean-4.12.0-linux/bin" >> "$GITHUB_PATH"
      - name: Initialize the pinned Mathlib dependencies
        working-directory: formal-analysis
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: '1'
        run: lake update
      - name: Download the exact analysis import cache
        working-directory: formal-analysis
        run: |
          lake exe cache get \
            Mathlib/NumberTheory/EulerProduct/DirichletLSeries.lean \
            Mathlib/Analysis/SpecificLimits/Normed.lean \
            Mathlib/Analysis/NormedSpace/FunctionSeries.lean \
            Mathlib/Analysis/Asymptotics/Asymptotics.lean \
            Mathlib/Analysis/PSeries.lean \
            Mathlib/Analysis/SpecialFunctions/Exp.lean \
            Mathlib/Analysis/SpecialFunctions/Log/Basic.lean \
            Mathlib/Analysis/SpecialFunctions/Log/Deriv.lean \
            Mathlib/Analysis/SpecialFunctions/Pow/Continuity.lean \
            Mathlib/Analysis/SpecialFunctions/Pow/Asymptotics.lean \
            Mathlib/Data/Real/Basic.lean \
            Mathlib/Tactic/NormNum.lean \
            Mathlib/Tactic/Linarith.lean \
            Mathlib/Tactic/GCongr.lean \
            Mathlib/Tactic/Ring.lean \
            Mathlib/Tactic/Positivity.lean
      - name: Actual real visibility theorem and axiom audit (P34)
        run: python3 scripts/check_formal_analysis.py --clean
  exact-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Standard-library exact suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Reproduce retained experiments
        run: PYTHONPATH=src python scripts/reproduce.py --check
      - name: Retained finite populations (chain agreement, census manifest)
        run: |
          PYTHONPATH=src python scripts/chain_agreement.py --check
          PYTHONPATH=src python scripts/census_manifest.py --check
          PYTHONPATH=src python scripts/pendant_family.py --check
          PYTHONPATH=src python scripts/whitney_switches.py --check
          PYTHONPATH=src python scripts/collision_census.py --check
          PYTHONPATH=src python scripts/symmetric_contexts.py --check
          PYTHONPATH=src python scripts/charge_interfaces.py --check
          PYTHONPATH=src python scripts/vakil_bridge.py --check
          PYTHONPATH=src python scripts/locality_family.py --check
          PYTHONPATH=src python scripts/overlap_hierarchy.py --check
          PYTHONPATH=src python scripts/loop_series.py --check
          PYTHONPATH=src python scripts/collision_cases.py --check
          PYTHONPATH=src python scripts/operator_experiments.py --check
          PYTHONPATH=src python scripts/robust_search.py --check
          PYTHONPATH=src python scripts/panels.py --check
          PYTHONPATH=src python scripts/compression.py --check
          PYTHONPATH=src python scripts/parametric_observability.py --check
          PYTHONPATH=src python scripts/separator_compiler.py --check
          PYTHONPATH=src python scripts/candidate_box_thermal.py --check
          PYTHONPATH=src python scripts/typed_contexts.py --check
          PYTHONPATH=src python scripts/typed_contexts.py --replay results/typed_contexts.json
          PYTHONPATH=src python scripts/thermal_diagnostics.py --check
          PYTHONPATH=src python scripts/incremental_locality.py --check
          PYTHONPATH=src python scripts/target_recovery.py --check
      - name: Repository and manuscript checks
        run: python scripts/check_repository.py
      - name: Published document links
        run: python scripts/check_links.py
      - name: Claude handoff ledger and dependency checks
        run: |
          python scripts/handoff.py verify
          python scripts/check_links.py CLAUDE.md handoff/*.md handoff/tasks/*.md docs/specifications/*.md docs/IMPLEMENTATION.md
