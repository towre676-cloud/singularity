name: Exact research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  exact-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Standard-library exact suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Reproduce retained experiments
        run: PYTHONPATH=src python scripts/reproduce.py --check
      - name: Repository and manuscript checks
        run: python scripts/check_repository.py
