name: Neural training contracts
on:
  push:
    paths:
      - 'src/singularity/training/**'
      - 'src/singularity/training_panels.py'
      - 'src/singularity/model_audit/**'
      - 'src/singularity/robust_coverage.py'
      - 'tests/test_model_audit.py'
      - 'tests/test_robust_coverage.py'
      - 'tests/test_adaptive_counts.py'
      - 'tests/test_v080_evidence.py'
      - 'scripts/confirm_robust_audit.py'
      - 'scripts/confirm_cross_domain.py'
      - 'applications/training_lab/results/robust_audit/**'
      - 'applications/training_lab/results/cross_domain/**'
      - 'tests/test_training*.py'
      - 'tests/test_byte_experts.py'
      - 'tests/test_byte_reference_baselines.py'
      - 'tests/test_checkpoint_regressions.py'
      - 'tests/test_predictive_mixture.py'
      - 'tests/test_online_blend.py'
      - 'scripts/*training*.py'
      - 'scripts/score_byte_mixture.py'
      - 'scripts/confirm_checkpoint_panels.py'
      - 'scripts/check_checkpoint_smoke.py'
      - 'scripts/check_runtime_pipeline.py'
      - 'scripts/confirm_predictive_mixture.py'
      - 'scripts/byte_reference_baselines.py'
      - 'scripts/*online*.py'
      - '.github/workflows/training-lab.yml'
  pull_request:
permissions:
  contents: read
jobs:
  cpu-scientific-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the measured CPU framework
        run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install the measured array dependency
        run: python -m pip install 'numpy==2.3.5'
      - name: Install the Hugging Face adapter dependency
        run: python -m pip install 'transformers==5.20.1'
      - name: Complete exact and optional scientific contracts
        run: PYTHONPATH=src python -m unittest discover -s tests -v
