<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">One chosen experiment reveals the difference</title>
<desc id="desc">Two terminal choices on the same path have volume-one reading 5/4. A shared-neighbor attachment changes the readings to 1 and 9/8 at q=1/2, giving the cheapest distinguishing experiment at cost one.</desc>
