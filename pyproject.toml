[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "singularity-relational-arithmetic"
version = "0.4.0"
description = "Exact relational height populations and arithmetic visibility"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Singularity project contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Mathematics"]

[project.scripts]
singularity = "singularity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
