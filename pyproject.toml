[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "singularity-relational-arithmetic"
version = "0.6.0"
description = "Exact relational height populations and arithmetic visibility"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Singularity project contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Mathematics"]

[project.scripts]
singularity = "singularity.cli:main"
singularity-train = "singularity.training.cli:main"

[project.optional-dependencies]
training = ["torch>=2.5", "numpy>=1.24", "matplotlib>=3.7", "pyarrow>=14"]

[tool.setuptools.packages.find]
where = ["src"]
